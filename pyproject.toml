[project]
name = "pixel-pilot"
version = "0.1.0"
description = "Attention-based click grounding for macOS GUI automation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "numpy>=2.0",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "pyautogui>=0.9",
    "pyobjc-framework-ApplicationServices",
    "pyobjc-framework-Quartz",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that require model loading (deselect with '-m \"not slow\"')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
